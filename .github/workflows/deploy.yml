# Deploys `build` to the beta site (https://uwomeds.pages.dev) and `redesign` (same features,
# fresh look) to https://redesign.uwomeds.pages.dev, on the hippoit@uwo.ca
# Cloudflare account. Order: database migrations, build, runtime secrets, deploy.
# Agents only push code; every credential lives in this repo's Actions secrets.
# It runs only after CI passes on `build`, so a broken migration never reaches the database.
# Until the secrets exist, the job says so and skips instead of failing.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [build, redesign]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_PROJECT_REF != '' && secrets.SUPABASE_DB_PASSWORD != '' }}
    steps:
      - name: Check deploy secrets
        if: env.READY != 'true'
        run: echo "::notice::Deploy skipped. Add the Cloudflare and Supabase secrets in Settings > Secrets and variables > Actions (plan Task 0A step 7)."

      - if: env.READY == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - if: env.READY == 'true'
        uses: pnpm/action-setup@v6.1.1
      - if: env.READY == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - if: env.READY == 'true'
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations and load the clubs once
        if: env.READY == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          # Not `supabase link`: it reads the project's API keys, secret key included, and the
          # access token is deliberately not allowed to. The token only looks up the pooler
          # address (Connection Pooling: Read); the password does the rest. Session mode
          # (port 5432), because GitHub's runners have no IPv6 for the direct address.
          pooler=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler")
          host=$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_host // .[0].db_host' <<<"$pooler")
          user=$(jq -r '[.[] | select(.database_type == "PRIMARY")][0].db_user // .[0].db_user' <<<"$pooler")
          pass=$(jq -rn --arg p "$SUPABASE_DB_PASSWORD" '$p|@uri')
          echo "::add-mask::$pass"
          test -n "$host" && test "$host" != null
          pnpm exec supabase db push --db-url "postgresql://$user:$pass@$host:5432/postgres"
          # First load of the club directory (only while the clubs table is empty).
          command -v psql >/dev/null || sudo apt-get install -y -qq postgresql-client
          node scripts/clubs-to-sql.mjs > "$RUNNER_TEMP/clubs.sql"
          psql "postgresql://$user:$pass@$host:5432/postgres" -v ON_ERROR_STOP=1 -q -t -f "$RUNNER_TEMP/clubs.sql"

      - name: Build
        if: env.READY == 'true'
        run: pnpm build

      # MedFriend becomes part of the site (plan Task 25). A read-only copy of the public
      # repo, without the Anki decks (over Pages' 25 MiB limit; they stay on GitHub Pages
      # until the R2 bucket exists) or the authoring tools. The repo itself isn't changed.
      - name: Check out MedFriend
        if: env.READY == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ vars.MEDFRIEND_REPO || 'schulichmed/preclerkship' }}
          path: medfriend-src
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !*.apkg
            !/tools/

      - name: Copy MedFriend into the site
        if: env.READY == 'true'
        run: node scripts/prepare-medfriend.mjs medfriend-src dist/medfriend

      - name: Sync runtime secrets to Pages
        if: env.READY == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        # Only secrets that are set are sent, so an unset one never blanks a working value.
        # The JSON is written to the runner's temp dir and removed straight after.
        run: |
          f="$RUNNER_TEMP/pages-secrets.json"
          node -e '
            const names = ["SUPABASE_URL","SUPABASE_ANON_KEY","GOOGLE_SERVICE_ACCOUNT_JSON","GOOGLE_CALENDAR_ID","TURNSTILE_SECRET_KEY","BREVO_API_KEY"];
            const out = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out), { mode: 0o600 });
            console.log("Secrets to sync:", Object.keys(out).join(", ") || "none");
          ' "$f"
          pnpm exec wrangler pages secret bulk "$f" --project-name uwomeds
          rm -f "$f"

      - name: Deploy to Cloudflare Pages
        if: env.READY == 'true'
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name uwomeds --branch "$BRANCH" --commit-dirty=true
