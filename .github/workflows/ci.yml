# Checks every pull request and every push to `build`: types, unit tests,
# database tests against a local Supabase, then end-to-end tests on the built site.
name: CI

on:
  pull_request:
  push:
    branches: [build]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build # astro check + astro build
      - run: pnpm test
      - run: pnpm exec supabase start
      - run: pnpm db:test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5.0.0
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
